name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.13.7

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run --locked --extra dev ruff check .

      - name: Format (ruff format --check)
        run: uv run --locked --extra dev ruff format --check .

      - name: Type check (mypy)
        run: uv run --locked --extra dev mypy app

      - name: Test (pytest)
        run: uv run --locked --extra dev pytest
