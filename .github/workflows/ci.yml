name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feat#*']

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.13.7

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run --locked --extra dev ruff check .

      - name: Format (ruff format --check)
        run: uv run --locked --extra dev ruff format --check .

      - name: Type check (mypy)
        run: uv run --locked --extra dev mypy app migrations

      - name: Test (pytest)
        run: uv run --locked --extra dev pytest

  postgis-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.7@sha256:1f0d64ef12bfb344d3569ab6419aca183258b146951daec83f0585d01e6c9cc9
        env:
          POSTGRES_USER: spoton_ci
          POSTGRES_PASSWORD: spoton_ci_only
          POSTGRES_DB: spoton_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spoton_ci -d spoton_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://spoton_ci:spoton_ci_only@127.0.0.1:5432/spoton_ci
      SPOTON_ALLOW_DB_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.7
          uv sync --locked --extra dev
      - name: Test actual PostGIS and migrations
        run: uv run --locked --extra dev pytest -m integration -rA --junitxml=integration.xml
      - name: Require executed tests with no skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('integration.xml').getroot().iter('testcase'))
          assert cases, 'No integration tests executed'
          assert not any(case.find(tag) is not None for case in cases for tag in ('skipped', 'failure', 'error'))
          localdata = [
              case for case in cases
              if 'test_localdata_upsert' in case.attrib.get('classname', '')
              or 'test_localdata_upsert' in case.attrib.get('file', '')
          ]
          assert len(localdata) >= 4, 'LocalData PostGIS integration tests were not executed'
          building_key = [
              case for case in cases
              if 'test_building_key_upsert' in case.attrib.get('classname', '')
              or 'test_building_key_upsert' in case.attrib.get('file', '')
          ]
          assert len(building_key) >= 2, 'building_key PostGIS integration tests were not executed'
          floor_unit = [
              case for case in cases
              if 'test_floor_unit_upsert' in case.attrib.get('classname', '')
              or 'test_floor_unit_upsert' in case.attrib.get('file', '')
          ]
          assert len(floor_unit) >= 2, 'floor_unit PostGIS integration tests were not executed'
          print(f'PostGIS integration: {len(cases)} passed, no skips')
          print(f'LocalData upsert integration: {len(localdata)} passed, no skips')
          print(f'building_key upsert integration: {len(building_key)} passed, no skips')
          print(f'floor_unit upsert integration: {len(floor_unit)} passed, no skips')
          PY
